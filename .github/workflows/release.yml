name: Release

# Tagging v1.1 builds, signs, notarizes, and publishes the release the in-app updater reads.
# The tag has to match CFBundleShortVersionString in Resources/Info.plist, or the job stops
# before it signs anything — a mismatch would ship an app that offers itself as an update
# forever.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Universal builds need the full Xcode build system, not just the Command Line Tools.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Check the tag against Info.plist
        id: version
        run: |
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$plist_version" != "$tag_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $plist_version"
            exit 1
          fi
          echo "version=$plist_version" >> "$GITHUB_OUTPUT"

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # Keep the login keychain in the search list so nothing else on the runner breaks.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt for keychain access.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Build, sign, notarize
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # build.sh sources .env, so hand it the same values from the repository secrets.
          umask 077
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } > .env
          ./build.sh --release
          rm -f .env "$RUNNER_TEMP/AuthKey.p8"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "LangKeys $VERSION" \
            --generate-notes \
            "build/LangKeys-$VERSION.dmg" \
            "build/LangKeys-$VERSION.zip"
